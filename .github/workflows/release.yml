name: Release

# Builds a signed release AAB (for Google Play) and APK (for GitHub Releases).
#
# Trigger: push a tag like v1.2.3, or run manually from the Actions tab.
# Versioning (see docs/PUBLISHING.md):
#   versionName = tag without the leading "v"          e.g. v1.2.3 -> 1.2.3
#   versionCode = MAJOR * 10000 + MINOR * 100 + PATCH   e.g. v1.2.3 -> 10203
# so MINOR and PATCH must stay below 100.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   PDFVIEWER_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   PDFVIEWER_KEYSTORE_PASSWORD  keystore password
#   PDFVIEWER_KEY_ALIAS          key alias inside the keystore
#   PDFVIEWER_KEY_PASSWORD       key password

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version X.Y.Z to build (leave empty to use the defaults in app/build.gradle.kts)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed AAB and APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PDFVIEWER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PDFVIEWER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PDFVIEWER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PDFVIEWER_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::Repository secret PDFVIEWER_${name} is not set. See docs/PUBLISHING.md."
              missing=1
            fi
          done
          exit "$missing"

      - name: Compute version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            raw="$REF_NAME"
          else
            raw="$INPUT_VERSION"
          fi
          if [ -z "$raw" ]; then
            echo "No version given: using the defaults from app/build.gradle.kts."
            echo "version_name=" >> "$GITHUB_OUTPUT"
            echo "version_code=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${raw#v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo "::error title=Bad version::'$raw' is not vMAJOR.MINOR.PATCH with MINOR and PATCH in 0..99."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          code=$(( major * 10000 + minor * 100 + patch ))
          if [ "$code" -lt 1 ] || [ "$code" -gt 2100000000 ]; then
            echo "::error title=Bad version::versionCode $code is outside Google Play's allowed range."
            exit 1
          fi
          echo "Building versionName=$version versionCode=$code"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Release builds never read or write the shared Gradle cache (no cache poisoning).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PDFVIEWER_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error title=Bad keystore::PDFVIEWER_KEYSTORE_BASE64 did not decode to a file."
            exit 1
          fi
          echo "PDFVIEWER_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build release AAB and APK
        env:
          PDFVIEWER_KEYSTORE_PASSWORD: ${{ secrets.PDFVIEWER_KEYSTORE_PASSWORD }}
          PDFVIEWER_KEY_ALIAS: ${{ secrets.PDFVIEWER_KEY_ALIAS }}
          PDFVIEWER_KEY_PASSWORD: ${{ secrets.PDFVIEWER_KEY_PASSWORD }}
          PDFVIEWER_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          PDFVIEWER_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew --stacktrace bundleRelease assembleRelease

      - name: Verify outputs are signed and versioned
        env:
          EXPECTED_NAME: ${{ steps.version.outputs.version_name }}
          EXPECTED_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$apk" ] || [ ! -f "$aab" ]; then
            echo "::error title=Unsigned build::Signed outputs missing (Gradle skipped signing?)."
            ls -la app/build/outputs/apk/release/ app/build/outputs/bundle/release/ || true
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          # Prints only the public certificate DN and digests (useful to compare with Play Console).
          "$apksigner" verify --print-certs "$apk" | grep -E 'certificate (SHA-256 digest|DN)'
          if ! jarsigner -verify "$aab" | grep 'jar verified' > /dev/null; then
            echo "::error title=Unsigned bundle::$aab is not signed."
            exit 1
          fi
          if [ -n "$EXPECTED_CODE" ]; then
            meta=app/build/outputs/apk/release/output-metadata.json
            actual_code=$(jq -r '.elements[0].versionCode' "$meta")
            actual_name=$(jq -r '.elements[0].versionName' "$meta")
            if [ "$actual_code" != "$EXPECTED_CODE" ] || [ "$actual_name" != "$EXPECTED_NAME" ]; then
              echo "::error title=Version mismatch::Built $actual_name ($actual_code), expected $EXPECTED_NAME ($EXPECTED_CODE). Does app/build.gradle.kts read PDFVIEWER_VERSION_CODE / PDFVIEWER_VERSION_NAME?"
              exit 1
            fi
          fi

      - name: Collect artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          name="${VERSION_NAME:-dev}"
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/pdfviewer-$name.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/pdfviewer-$name.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-$name.txt"
          (cd dist && sha256sum pdfviewer-* > SHA256SUMS.txt)

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: dist/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # Needed to deobfuscate crash reports for this exact build. Keep it with the release.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping
          path: dist/mapping-*.txt
          if-no-files-found: error
          retention-days: 90

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

  github-release:
    name: Draft GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job allowed to write: it creates the draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: fastlane

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: dist

      - name: Prepare release notes
        env:
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          changelog="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ -n "$VERSION_CODE" ] && [ -f "$changelog" ]; then
            cp "$changelog" release-notes.md
          else
            echo "Release notes: add fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt" > release-notes.md
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: PDF Viewer ${{ needs.build.outputs.version_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
