name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Fails the build if gradle/wrapper/gradle-wrapper.jar is not an official Gradle release.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle state. Only builds on the default branch write to the cache.
      - uses: gradle/actions/setup-gradle@v5

      - name: Compile, unit test and lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

  # Builds the minified (R8 full mode) release variant without signing secrets, so broken
  # keep rules, missing-class errors or release-only lint (lintVital) failures show up in
  # PRs instead of on release day. The output is unsigned and is not uploaded.
  release-build:
    name: Release build (R8, unsigned)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble minified release
        run: ./gradlew --stacktrace assembleRelease

      - name: Upload R8 outputs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: r8-outputs
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 7
